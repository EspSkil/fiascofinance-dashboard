<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fiasco Finance Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px 50px;
      color: #222;
      background: #fafafa;
    }

    h1 {
      margin-bottom: 4px;
    }

    h2 {
      margin-top: 38px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-top: 0;
    }

    .status-box {
      background: #f1f1f1;
      padding: 14px 16px;
      border-radius: 8px;
      margin: 22px 0;
    }

    .ok {
      color: #16820d;
      font-weight: bold;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin: 20px 0 30px;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 16px;
    }

    .card-label {
      color: #666;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .card-value {
      font-size: 24px;
      font-weight: bold;
    }

    .card-small {
      font-size: 14px;
      color: #666;
      margin-top: 4px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 15px;
      background: white;
    }

    th,
    td {
      border-bottom: 1px solid #ddd;
      padding: 9px 8px;
      text-align: right;
      white-space: nowrap;
    }

    th {
      background: #f3f3f3;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    .rank-1 td {
      font-weight: bold;
      background: #f3f8ee;
    }

    .medal {
      width: 55px;
      text-align: center !important;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .small {
      font-size: 13px;
      color: #666;
    }

    @media (max-width: 700px) {
      .cards {
        grid-template-columns: 1fr;
      }

      body {
        margin-top: 20px;
      }
    }
  </style>
</head>

<body>

  <h1>Fiasco Finance</h1>
  <p class="subtitle">Live Championship Dashboard</p>

  <div id="loading" class="status-box">
    Laster data fra Google Sheets...
  </div>

  <div id="summaryCards"></div>
  <div id="leaderboardSection"></div>
  <div id="themeSection"></div>
  <div id="controlSection"></div>


<script>

  // ============================================================
  // GOOGLE SHEETS
  // ============================================================

  const historyUrl =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vQMD50jmOkPa0hLGblFat2ojNw_xl02KpmNSkaS-On_fnuNYUzVXUgoXbid1-pI-gleYDFOL9q3K7v5/pub?gid=48037430&single=true&output=csv";

  const dashboardDataUrl =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vQMD50jmOkPa0hLGblFat2ojNw_xl02KpmNSkaS-On_fnuNYUzVXUgoXbid1-pI-gleYDFOL9q3K7v5/pub?gid=1311778898&single=true&output=csv";


  // ============================================================
  // HJELPEFUNKSJONER
  // ============================================================

  async function loadCsv(url) {
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Kunne ikke hente CSV-data.");
    }

    const csvText = await response.text();

    const parsed = Papa.parse(csvText, {
      header: true,
      skipEmptyLines: true
    });

    return parsed.data;
  }


  function parseNumber(value) {
    if (value === null || value === undefined) {
      return NaN;
    }

    const text = String(value)
      .trim()
      .replace(/\s/g, "")
      .replace(/[−–—]/g, "-")
      .replace("%", "")
      .replace(",", ".");

    return Number(text);
  }


  function parsePercent(value) {
    return parseNumber(value) / 100;
  }


  function formatPercent(value, decimals = 2) {
    return (value * 100)
      .toFixed(decimals)
      .replace(".", ",") + "%";
  }


  function formatNumber(value, decimals = 2) {
    return Number(value)
      .toFixed(decimals)
      .replace(".", ",");
  }


  // ============================================================
  // OPPDAG DELTAKERE AUTOMATISK
  // ============================================================

 function detectParticipants(dashboardRaw) {
  if (!dashboardRaw.length) {
    throw new Error("DashboardData er tom.");
  }

  const firstRow = dashboardRaw[0];

  const fixedColumns = new Set([
    "TEMA",
    "Vekt",
    "Type"
  ]);

  return Object.keys(firstRow)
    .filter(key =>
      key &&
      !key.startsWith("_") &&
      !fixedColumns.has(key)
    );
}


  // ============================================================
  // OPPDAG KONKURRANSETEMAER AUTOMATISK
  // ============================================================

  function getCompetitionRows(rows, participants) {
    return rows.filter(row => {
      const basicFieldsOk =
        row["TEMA"] &&
        row["Vekt"] &&
        row["Type"];

      const participantFieldsOk =
        participants.every(person =>
          row[person] !== undefined &&
          row[person] !== ""
        );

      return basicFieldsOk && participantFieldsOk;
    });
  }


  // ============================================================
  // HISTORIKK
  // ============================================================

  function getValidHistoryRows(rows, competitionRows) {
    const themes = competitionRows.map(row => row["TEMA"]);

    return rows.filter(row => {
      if (!row["Dato"]) {
        return false;
      }

      return themes.every(theme =>
        row[theme] !== undefined &&
        row[theme] !== ""
      );
    });
  }


  // ============================================================
  // FAKTISK ENDRING PER TEMA
  // ============================================================

  function calculateActualChange(themeRow, startRow, latestRow) {
    const theme = themeRow["TEMA"];
    const type = String(themeRow["Type"])
      .trim()
      .toLowerCase();

    const startValue =
      parseNumber(startRow[theme]);

    const latestValue =
      parseNumber(latestRow[theme]);


    if (type === "prosent") {
      return latestValue / 100;
    }


    if (type === "pris") {
      if (!Number.isFinite(startValue) || startValue === 0) {
        throw new Error(
          `Ugyldig startverdi for tema "${theme}".`
        );
      }

      return (latestValue / startValue) - 1;
    }


    throw new Error(
      `Ukjent Type "${themeRow["Type"]}" for tema "${theme}". Bruk Pris eller Prosent.`
    );
  }


  // ============================================================
  // BEREGN KONKURRANSEN
  // ============================================================

  function calculateCompetition(
    competitionRows,
    participants,
    startRow,
    latestRow
  ) {

    const participantScores = {};

    participants.forEach(person => {
      participantScores[person] = 0;
    });


    const themeResults = [];


    competitionRows.forEach(row => {
      const theme = row["TEMA"];
      const weight = parseNumber(row["Vekt"]);

      const actualChange =
        calculateActualChange(
          row,
          startRow,
          latestRow
        );


      let closestPerson = null;
      let closestDistance = Infinity;

      const personResults = {};


      participants.forEach(person => {
        const prediction =
          parsePercent(row[person]);

        const absoluteDistance =
          Math.abs(actualChange - prediction);

        const weightedDistance =
          absoluteDistance * weight;


        participantScores[person] +=
          weightedDistance;


        personResults[person] = {
          prediction,
          absoluteDistance,
          weightedDistance
        };


        if (absoluteDistance < closestDistance) {
          closestDistance = absoluteDistance;
          closestPerson = person;
        }
      });


      themeResults.push({
        theme,
        type: row["Type"],
        weight,
        actualChange,
        closestPerson,
        closestDistance,
        personResults
      });
    });


    const leaderboard =
      participants
        .map(person => ({
          person,
          score: participantScores[person]
        }))
        .sort((a, b) =>
          a.score - b.score
        );


    return {
      leaderboard,
      themeResults
    };
  }


  // ============================================================
  // TOPPKORT
  // ============================================================

  function showSummaryCards(
    leaderboard,
    latestRow,
    competitionRows,
    participants
  ) {

    const leader = leaderboard[0];
    const second = leaderboard[1];

    const gap =
      second
        ? second.score - leader.score
        : 0;


    document.getElementById("summaryCards").innerHTML = `

      <div class="cards">

        <div class="card">
          <div class="card-label">
            🏆 Leder
          </div>

          <div class="card-value">
            ${leader.person}
          </div>

          <div class="card-small">
            Score ${formatPercent(leader.score)}
          </div>
        </div>


        <div class="card">
          <div class="card-label">
            ⚔️ Avstand #1–#2
          </div>

          <div class="card-value">
            ${second ? formatPercent(gap) : "-"}
          </div>

          <div class="card-small">
            ${second ? second.person + " på andreplass" : "Kun én deltaker"}
          </div>
        </div>


        <div class="card">
          <div class="card-label">
            📅 Siste status
          </div>

          <div class="card-value">
            ${latestRow["Dato"]}
          </div>

          <div class="card-small">
            ${competitionRows.length} temaer ·
            ${participants.length} deltakere
          </div>
        </div>

      </div>
    `;
  }


  // ============================================================
  // LEADERBOARD
  // ============================================================

  function showLeaderboard(leaderboard) {
    const medals = [
      "🥇",
      "🥈",
      "🥉"
    ];


    let html = `

      <h2>🏆 Live leaderboard</h2>

      <p>
        Lavest samlet vektet %-avstand leder konkurransen.
      </p>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th class="medal">Plass</th>
              <th>Deltaker</th>
              <th>Score</th>
            </tr>
          </thead>

          <tbody>
    `;


    leaderboard.forEach((row, index) => {

      html += `

        <tr class="${index === 0 ? "rank-1" : ""}">

          <td class="medal">
            ${medals[index] || (index + 1)}
          </td>

          <td>
            ${row.person}
          </td>

          <td>
            ${formatPercent(row.score)}
          </td>

        </tr>
      `;
    });


    html += `
          </tbody>
        </table>
      </div>
    `;


    document.getElementById(
      "leaderboardSection"
    ).innerHTML = html;
  }


  // ============================================================
  // STATUS PER TEMA
  // ============================================================

  function showThemeResults(themeResults) {
    let html = `

      <h2>📊 Status per tema</h2>

      <p>
        Faktisk utvikling, vekting og nærmeste deltaker.
      </p>

      <div class="table-wrap">

        <table>

          <thead>
            <tr>
              <th>Tema</th>
              <th>Type</th>
              <th>Vekt</th>
              <th>Faktisk utvikling</th>
              <th>Nærmest</th>
              <th>Avstand</th>
            </tr>
          </thead>

          <tbody>
    `;


    themeResults.forEach(row => {

      html += `

        <tr>

          <td>
            ${row.theme}
          </td>

          <td>
            ${row.type}
          </td>

          <td>
            ${formatNumber(row.weight, 1)}×
          </td>

          <td>
            ${formatPercent(row.actualChange)}
          </td>

          <td>
            ${row.closestPerson}
          </td>

          <td>
            ${formatPercent(row.closestDistance)}
          </td>

        </tr>
      `;
    });


    html += `
          </tbody>
        </table>
      </div>
    `;


    document.getElementById(
      "themeSection"
    ).innerHTML = html;
  }


  // ============================================================
  // KONTROLLINFO
  // ============================================================

  function showControlInfo(
    participants,
    competitionRows,
    startRow,
    latestRow
  ) {

    document.getElementById("controlSection").innerHTML = `

      <h2>Datakontroll</h2>

      <p class="small">
        Dashboardet har automatisk funnet:
        <strong>${participants.length} deltakere</strong>
        og
        <strong>${competitionRows.length} temaer</strong>.
      </p>

      <p class="small">
        Startdato:
        <strong>${startRow["Dato"]}</strong>
        ·
        siste status:
        <strong>${latestRow["Dato"]}</strong>
      </p>

      <p class="small">
        Deltakere:
        ${participants.join(", ")}
      </p>

      <p class="small">
        Temaer:
        ${competitionRows
          .map(row => row["TEMA"])
          .join(", ")}
      </p>
    `;
  }


  // ============================================================
  // START
  // ============================================================

  async function loadData() {
    try {

      const [
        historyRaw,
        dashboardRaw
      ] = await Promise.all([
        loadCsv(historyUrl),
        loadCsv(dashboardDataUrl)
      ]);
console.log("RAW DashboardData:", dashboardRaw);
console.log("Kolonnenavn:", Object.keys(dashboardRaw[0] || {}));

      // Oppdag deltakere dynamisk

      const participants =
        detectParticipants(dashboardRaw);


      if (participants.length === 0) {
        throw new Error(
          "Fant ingen deltakere i DashboardData."
        );
      }


      // Oppdag temaer dynamisk

      const competitionRows =
        getCompetitionRows(
          dashboardRaw,
          participants
        );


      if (competitionRows.length === 0) {
        throw new Error(
          "Fant ingen gyldige konkurransetemaer."
        );
      }


      // Finn historikkrader som er komplette
      // for alle aktive temaer

      const historyRows =
        getValidHistoryRows(
          historyRaw,
          competitionRows
        );


      if (historyRows.length < 1) {
        throw new Error(
          "Fant ingen komplette historikkrader."
        );
      }


      const startRow =
        historyRows[0];

      const latestRow =
        historyRows[
          historyRows.length - 1
        ];


      // Beregn konkurransen

      const result =
        calculateCompetition(
          competitionRows,
          participants,
          startRow,
          latestRow
        );


      // Vis dashboard

      showSummaryCards(
        result.leaderboard,
        latestRow,
        competitionRows,
        participants
      );

      showLeaderboard(
        result.leaderboard
      );

      showThemeResults(
        result.themeResults
      );

      showControlInfo(
        participants,
        competitionRows,
        startRow,
        latestRow
      );


      document.getElementById(
        "loading"
      ).innerHTML = `

        <span class="ok">
          ✓ Data lastet.
          Status beregnet per ${latestRow["Dato"]}.
        </span>
      `;


      console.log(
        "Deltakere:",
        participants
      );

      console.log(
        "Temaer:",
        competitionRows
      );

      console.log(
        "Leaderboard:",
        result.leaderboard
      );

      console.log(
        "Temaresultater:",
        result.themeResults
      );

    }

    catch (error) {

      console.error(error);

      document.getElementById(
        "loading"
      ).innerHTML = `

        <span class="error">
          Feil: ${error.message}
        </span>
      `;
    }
  }


  loadData();

</script>

</body>
</html>
