<html lang="no">
<head>

  <style>

      margin-top: 0;

</head>

<script>

const historyUrl =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQMD50jmOkPa0hLGblFat2ojNw_xl02KpmNSkaS-On_fnuNYUzVXUgoXbid1-pI-gleYDFOL9q3K7v5/pub?gid=48037430&single=true&output=csv";

const dashboardDataUrl =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQMD50jmOkPa0hLGblFat2ojNw_xl02KpmNSkaS-On_fnuNYUzVXUgoXbid1-pI-gleYDFOL9q3K7v5/pub?gid=1311778898&single=true&output=csv";


let scoreChart = null;
let historyChart = null;
let simChart = null;

let currentParticipants = [];
let currentThemeResults = [];
let currentCompetitionRows = [];
let currentHistoryRows = [];

let currentStartRow = null;
let currentLatestRow = null;
let currentOfficialResult = null;

let selectedParticipants = new Set();
let selectedThemes = new Set();

let selectedHistoryParticipants = new Set();

let historyMode = "rank";
let simChartMode = "sim";

let simulationChanges = {};


const chartColors = [
  "#4472C4",
  "#ED7D31",
  "#A5A5A5",
  "#FFC000",
  "#5B9BD5",
  "#70AD47",
  "#264478",
  "#9E480E",
  "#636363",
  "#997300",
  "#255E91",
  "#43682B"
];


async function loadCsv(url) {

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("Kunne ikke hente CSV-data.");
  }

  const csvText = await response.text();

  return Papa.parse(csvText, {
    header: true,
    skipEmptyLines: true
  }).data;
}


function parseNumber(value) {

  if (value === null || value === undefined) {
    return NaN;
  }

  return Number(
    String(value)
      .trim()
      .replace(/\s/g, "")
      .replace(/[−–—]/g, "-")
      .replace("%", "")
      .replace(",", ".")
  );
}


function parsePercent(value) {
  return parseNumber(value) / 100;
}


function formatPercent(value, decimals = 2) {

  return (value * 100)
    .toFixed(decimals)
    .replace(".", ",") + "%";
}


function formatPercentPoints(value, decimals = 2) {

  return Number(value)
    .toFixed(decimals)
    .replace(".", ",") + "%";
}


function formatNumber(value, decimals = 2) {

  return Number(value)
    .toFixed(decimals)
    .replace(".", ",");
}


function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}


function detectParticipants(dashboardRaw) {

  const competitionRow =
    dashboardRaw.find(row =>
      row["TEMA"] &&
      row["Vekt"] &&
      row["Type"]
    );

  if (!competitionRow) {
    throw new Error(
      "Fant ingen gyldig konkurranserad i DashboardData."
    );
  }

  const fixedColumns =
    new Set([
      "TEMA",
      "Vekt",
      "Type"
    ]);

  return Object.keys(competitionRow)
    .filter(key =>
      key &&
      !key.startsWith("_") &&
      !fixedColumns.has(key) &&
      competitionRow[key] !== undefined
    );
}


function getCompetitionRows(
  rows,
  participants
) {

  return rows.filter(row =>

    row["TEMA"] &&
    row["Vekt"] &&
    row["Type"] &&

    participants.every(person =>
      row[person] !== undefined &&
      row[person] !== ""
    )
  );
}


function getValidHistoryRows(
  rows,
  competitionRows
) {

  const themes =
    competitionRows.map(
      row => row["TEMA"]
    );

  return rows.filter(row => {

    if (!row["Dato"]) {
      return false;
    }

    return themes.every(theme =>
      row[theme] !== undefined &&
      row[theme] !== ""
    );
  });
}


function calculateActualChange(
  themeRow,
  startRow,
  statusRow
) {

  const theme =
    themeRow["TEMA"];

  const type =
    String(themeRow["Type"])
      .trim()
      .toLowerCase();

  const start =
    parseNumber(
      startRow[theme]
    );

  const latest =
    parseNumber(
      statusRow[theme]
    );


  if (type === "prosent") {
    return latest / 100;
  }


  if (type === "pris") {

    if (
      !Number.isFinite(start) ||
      start === 0
    ) {

      throw new Error(
        `Ugyldig startverdi for "${theme}".`
      );
    }

    return latest / start - 1;
  }


  throw new Error(
    `Ukjent Type "${themeRow["Type"]}" for "${theme}".`
  );
}


function calculateCompetition(
  competitionRows,
  participants,
  startRow,
  statusRow
) {

  const participantScores =
    Object.fromEntries(
      participants.map(
        person => [person, 0]
      )
    );


  const themeResults = [];


  competitionRows.forEach(row => {

    const theme =
      row["TEMA"];

    const weight =
      parseNumber(
        row["Vekt"]
      );

    const actualChange =
      calculateActualChange(
        row,
        startRow,
        statusRow
      );


    let closestPerson = null;
    let closestDistance = Infinity;

    const personResults = {};


    participants.forEach(person => {

      const prediction =
        parsePercent(
          row[person]
        );

      const absoluteDistance =
        Math.abs(
          actualChange -
          prediction
        );

      const weightedDistance =
        absoluteDistance *
        weight;


      participantScores[person] +=
        weightedDistance;


      personResults[person] = {
        prediction,
        absoluteDistance,
        weightedDistance
      };


      if (
        absoluteDistance <
        closestDistance
      ) {

        closestDistance =
          absoluteDistance;

        closestPerson =
          person;
      }
    });


    themeResults.push({

      theme,
      type: row["Type"],
      weight,
      actualChange,
      closestPerson,
      closestDistance,
      personResults
    });
  });


  const leaderboard =
    participants
      .map(person => ({
        person,
        score:
          participantScores[person]
      }))
      .sort(
        (a, b) =>
          a.score -
          b.score
      );


  return {
    leaderboard,
    themeResults
  };
}

}


function showLeaderboard(

  const medals = [

  ];


  let html = `

    </p>

    <div class="table-wrap">

        <thead>

            <th>

  document.getElementById(

}


function createFilterButton(
  label,
  isActive,
  callback,
  utility = false
) {

  const button =
    document.createElement(
      "button"
    );

  button.type =
    "button";

  button.textContent =
    label;

  button.className =
    "filter-button" +
    (
      isActive
        ? " active"
        : ""
    ) +
    (
      utility
        ? " utility"
        : ""
    );

  button.addEventListener(
    "click",
    callback
  );

  return button;
}


function themeColor(theme) {

  const index =
    currentThemeResults
      .findIndex(
        row =>
          row.theme === theme
      );

  return chartColors[
    (
      index < 0
        ? 0
        : index
    ) %
    chartColors.length
  ];
}


function participantColor(person) {

  const index =
    currentParticipants
      .indexOf(person);

  return chartColors[
    (
      index < 0
        ? 0
        : index
    ) %
    chartColors.length
  ];
}

) {

      📚 Hva avgjør stillingen?
    </h2>

    <p>
      Hvert felt viser hvor mye

        </div>

function renderFilterButtons() {

  const participantContainer =
    document.getElementById(
      "participantFilters"
    );

  const themeContainer =
    document.getElementById(
      "themeFilters"
    );


  participantContainer.innerHTML =
    "";

  themeContainer.innerHTML =
    "";


  participantContainer.appendChild(

    createFilterButton(

      "Alle",

      false,

      () => {

        selectedParticipants =
          new Set(
            currentParticipants
          );

        renderFilterButtons();
        renderStackedChart();
      },

      true
    )
  );


  participantContainer.appendChild(

    createFilterButton(

      "Ingen",

      false,

      () => {

        selectedParticipants =
          new Set();

        renderFilterButtons();
        renderStackedChart();
      },

      true
    )
  );


  currentParticipants.forEach(
    person => {

      participantContainer
        .appendChild(

          createFilterButton(

            person,

            selectedParticipants
              .has(person),

            () => {

              if (
                selectedParticipants
                  .has(person)
              ) {

                selectedParticipants
                  .delete(person);

              } else {

                selectedParticipants
                  .add(person);
              }

              renderFilterButtons();
              renderStackedChart();
            }
          )
        );
    }
  );


  themeContainer.appendChild(

    createFilterButton(

      "Alle",

      false,

      () => {

        selectedThemes =
          new Set(
            currentThemeResults
              .map(
                row =>
                  row.theme
              )
          );

        renderFilterButtons();
        renderStackedChart();
      },

      true
    )
  );


  themeContainer.appendChild(

    createFilterButton(

      "Ingen",

      false,

      () => {

        selectedThemes =
          new Set();

        renderFilterButtons();
        renderStackedChart();
      },

      true
    )
  );


  currentThemeResults.forEach(
    row => {

      themeContainer
        .appendChild(

          createFilterButton(

            row.theme,

            selectedThemes
              .has(row.theme),

            () => {

              if (
                selectedThemes
                  .has(row.theme)
              ) {

                selectedThemes
                  .delete(
                    row.theme
                  );

              } else {

                selectedThemes
                  .add(
                    row.theme
                  );
              }

              renderFilterButtons();
              renderStackedChart();
            }
          )
        );
    }
  );
}


function stackedDatasets(
  themeResults,
  participants
) {

  return themeResults.map(
    themeRow => ({

      label:
        themeRow.theme,

      backgroundColor:
        themeColor(
          themeRow.theme
        ),

      borderColor:
        themeColor(
          themeRow.theme
        ),

      borderWidth: 1,

      data:
        participants.map(
          person =>
            themeRow
              .personResults[
                person
              ]
              .weightedDistance *
            100
        ),

      themeRow
    })
  );
}


const stackTotalPlugin = {

  id:
    "stackTotalLabels",

  afterDatasetsDraw(chart) {

    const {
      ctx,
      scales: {
        x,
        y
      }
    } = chart;


    ctx.save();

    ctx.font =
      "bold 12px Arial";

    ctx.textAlign =
      "center";

    ctx.fillStyle =
      "#222";


    chart.data.labels
      .forEach(
        (label, index) => {

          const total =
            chart.data.datasets
              .reduce(
                (
                  sum,
                  dataset
                ) =>
                  sum +
                  (
                    dataset.data[
                      index
                    ] || 0
                  ),
                0
              );


          if (total > 0) {

            ctx.fillText(

              formatPercentPoints(
                total
              ),

              x.getPixelForValue(
                index
              ),

              y.getPixelForValue(
                total
              ) - 8
            );
          }
        }
      );


    ctx.restore();
  }
};


function renderStackedChart() {

  const participants =
    currentParticipants
      .filter(
        person =>
          selectedParticipants
            .has(person)
      );


  const themes =
    currentThemeResults
      .filter(
        row =>
          selectedThemes
            .has(row.theme)
      );


  document.getElementById(
    "chartSelectionInfo"

function buildHistoricalResults() {

  return currentHistoryRows
    .map(row => {

      const result =
        calculateCompetition(

          currentCompetitionRows,
          currentParticipants,
          currentStartRow,
          row
        );


      const ranks = {};
      const scores = {};


      result.leaderboard.forEach(
        (entry, index) => {

          ranks[
            entry.person
          ] =
            index + 1;

          scores[
            entry.person
          ] =
            entry.score;
        }
      );


      return {

        date:
          row["Dato"],

        ranks,
        scores
      };
    }
  );
}

function getSliderRange(
  themeRow,
  currentChange
) {

  const predictions =
    currentParticipants
      .map(
        person =>
          themeRow
            .personResults[
              person
            ]
            .prediction
      )
      .filter(
        Number.isFinite
      );


  const values = [
    0,
    currentChange,
    ...predictions
  ];


  const minValue =
    Math.min(
      ...values
    );

  const maxValue =
    Math.max(
      ...values
    );

  const span =
    Math.max(
      0.10,
      maxValue -
      minValue
    );

  const padding =
    Math.max(
      0.10,
      span * 0.35
    );


  let min =
    minValue -
    padding;

  let max =
    maxValue +
    padding;


  const type =
    String(
      themeRow.type
    )
    .trim()
    .toLowerCase();


  if (type === "pris") {

    min =
      Math.max(
        -0.95,
        Math.min(
          -0.80,
          min
        )
      );

    max =
      Math.max(
        2.00,
        max
      );

  } else {

    min =
      Math.min(
        -0.20,
        min
      );

    max =
      Math.max(
        0.20,
        max
      );
  }


  min =
    Math.floor(
      min * 20
    ) / 20;

  max =
    Math.ceil(
      max * 20
    ) / 20;


  return {

    min,
    max,
    step: 0.005
  };
}


function rawValueFromChange(
  themeRow,
  change
) {

  const theme =
    themeRow.theme;

  const type =
    String(
      themeRow.type
    )
    .trim()
    .toLowerCase();


  if (type === "pris") {

    return (
      parseNumber(
        currentStartRow[
          theme
        ]
      ) *
      (
        1 + change
      )
    );
  }


  return change * 100;
}


function currentRawValue(

              Dagens status

                      nowRaw,
                      2
                    ) +
                    " · "
                  : ""

                formatPercent(
                  current
                )
              }

          </div>

            <div class="sim-value-label">
              Simulert

            <div

              id="sim-display-${safeId(
                themeRow.theme
              )}">

              ${
                isPrice
                  ? formatNumber(
                      simulatedRaw,
                      2
                    ) +
                    " · "
                  : ""
              }

              ${
                formatPercent(
                  simulated
                )
              }

            </div>

          </div>

        </div>


        <div class="slider-shell">

          <div
            class="slider-marker start"
            style="left:${startPosition}%">

            START 0%

          </div>


          <div
            class="slider-marker current"
            style="left:${currentPosition}%">

            NÅ
            ${
              formatPercent(
                current,
                1
              )
            }

          </div>


          <input
            class="sim-slider"
            id="slider-${safeId(
              themeRow.theme
            )}"
            type="range"
            min="${range.min}"
            max="${range.max}"
            step="${range.step}"
            value="${simulated}">


          <div class="sim-range-labels">

            <span>
              ${
                formatPercent(
                  range.min,
                  0
                )
              }
            </span>

            <span>
              ${
                formatPercent(
                  range.max,
                  0
                )
              }

          slider.value =
            value;


          applyChange(
            value
          );
        };
    }

function safeId(text) {

  return String(text)
    .replace(
      /[^a-zA-Z0-9_-]/g,
      "_"
    );
}


function officialRankMap() {

  const map = {};


  currentOfficialResult
    .leaderboard
    .forEach(
      (entry, index) => {

        map[
          entry.person
        ] =
          index + 1;
      }
    );


  return map;
}


function movementHtml(
  person,
  newRank
) {

  const oldRank =
    officialRankMap()[
      person
    ];


  const delta =
    oldRank -
    newRank;


  if (delta > 0) {

    return `

      <span class="movement-up">
        ↑${delta}
      </span>
    `;
  }


  if (delta < 0) {

    return `

      <span class="movement-down">
        ↓${Math.abs(delta)}
      </span>
    `;
  }


  return `

    <span class="movement-same">
      —
    </span>
  `;
}

function showThemeResults(
  themeResults
) {

  let html = `

    <h2>
      📊 Status per tema
    </h2>

    <p>
      Faktisk utvikling,
      vekting og nærmeste deltaker.
    </p>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Tema</th>
            <th>Type</th>
            <th>Vekt</th>
            <th>Faktisk utvikling</th>
            <th>Nærmest</th>
            <th>Avstand</th>
          </tr>

        </thead>

        <tbody>
  `;


  themeResults.forEach(
    row => {

      html += `

        <tr>

          <td>
            ${row.theme}
          </td>

          <td>
            ${row.type}
          </td>

          <td>
            ${formatNumber(
              row.weight,
              1
            )}×
          </td>

          <td>
            ${formatPercent(
              row.actualChange
            )}
          </td>

          <td>
            ${row.closestPerson}
          </td>

          <td>
            ${formatPercent(
              row.closestDistance
            )}
          </td>

        </tr>
      `;
    }
  );


  html += `

        </tbody>
      </table>
    </div>
  `;


  document.getElementById(
    "themeSection"
  ).innerHTML = html;
}


function showControlInfo(
  participants,
  competitionRows,
  startRow,
  latestRow
) {

  document.getElementById(
    "controlSection"
  ).innerHTML = `

    <h2>
      Datakontroll
    </h2>

    <p class="small">

      Dashboardet har automatisk
      funnet

      <strong>
        ${participants.length}
        deltakere
      </strong>

      og

      <strong>
        ${competitionRows.length}
        temaer
      </strong>.

    </p>


    <p class="small">

      Startdato:

      <strong>
        ${startRow["Dato"]}
      </strong>

      · siste status:

      <strong>
        ${latestRow["Dato"]}
      </strong>

    </p>
  `;
}


async function loadData() {

  try {

    const [
      historyRaw,
      dashboardRaw
    ] =
      await Promise.all([

        loadCsv(
          historyUrl
        ),

        loadCsv(
          dashboardDataUrl
        )
      ]);


    const participants =
      detectParticipants(
        dashboardRaw
      );


    const competitionRows =
      getCompetitionRows(

        dashboardRaw,
        participants
      );


    if (
      !competitionRows.length
    ) {

      throw new Error(
        "Fant ingen gyldige konkurransetemaer."
      );
    }


    const historyRows =
      getValidHistoryRows(

        historyRaw,
        competitionRows
      );


    if (
      !historyRows.length
    ) {

      throw new Error(
        "Fant ingen komplette historikkrader."
      );
    }


    const startRow =
      historyRows[0];


    const latestRow =
      historyRows[
        historyRows.length -
        1
      ];


    const result =
      calculateCompetition(

        competitionRows,
        participants,
        startRow,
        latestRow
      );


    currentParticipants =
      participants;

    currentThemeResults =
      result.themeResults;

    currentCompetitionRows =
      competitionRows;

    currentHistoryRows =
      historyRows;

    currentStartRow =
      startRow;

    currentLatestRow =
      latestRow;

    currentOfficialResult =
      result;


    showSummaryCards(

      result.leaderboard,
      latestRow,
      competitionRows,
      participants
    );


    showLeaderboard(
      result.leaderboard
    );


    createChartSection(

      participants,
      result.themeResults
    );


    createHistorySection();


    createSimulatorSection();


    showThemeResults(
      result.themeResults
    );


    showControlInfo(

      participants,
      competitionRows,
      startRow,
      latestRow
    );


    document.getElementById(
      "loading"
    ).innerHTML = `

      <span class="ok">

        ✓ Data lastet.
        Status beregnet per
        ${latestRow["Dato"]}.

      </span>
    `;


    console.log(
      "Historikkpunkter:",
      historyRows.length
    );


    console.log(
      "Leaderboard:",
      result.leaderboard
    );

  }

  catch (error) {

    console.error(
      error
    );


    document.getElementById(
      "loading"
    ).innerHTML = `

      <span class="error">

        Feil:
        ${error.message}

      </span>
    `;
  }
}


loadData();

</script>

</body>
</html>
